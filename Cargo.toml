[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# Shared dependency versions live here; crates opt in with `foo.workspace = true`.
[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for this project.
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
debug = "line-tables-only" # keep symbols for flamegraphs (PR 12)